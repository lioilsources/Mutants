name: mutant_core
description: Herní logika pro Mutant – kooperativní skládací karetní hra (čistý Dart, bez Flutteru).
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.10.0

executables:
  sim: sim

dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.0

# Bundled into the Flutter app as packages/mutant_core/assets/… so the engine
# and the UI read the same card definitions. Ignored by the Dart CLI.
flutter:
  assets:
    - assets/cards.json
    - assets/names.json
